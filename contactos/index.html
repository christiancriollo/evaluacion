<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone | Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <h1>TechZone</h1>

        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="../productos/index.html">Productos</a></li>
            <li><a href="../nosotros/index.html">Nosotros</a></li>
            <li><a href="index.html">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="contacto">

        <div class="informacion">

            <h2>Contáctanos</h2>

            <p>
                ¿Tienes alguna pregunta? Escríbenos y estaremos
                encantados de ayudarte.
            </p>

            <div class="dato">
                <strong>📍 Dirección</strong>
                <p>Av. Principal 123, Ecuador</p>
            </div>

            <div class="dato">
                <strong>📞 Teléfono</strong>
                <p>099 123 4567</p>
            </div>

            <div class="dato">
                <strong>📧 Correo</strong>
                <p>contacto@techzone.com</p>
            </div>

        </div>

        <form>

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
            >

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                placeholder="ejemplo@gmail.com"
            >

            <label for="asunto">Asunto</label>
            <input
                type="text"
                id="asunto"
                placeholder="Escribe el asunto"
            >

            <label for="mensaje">Mensaje</label>
            <textarea
                id="mensaje"
                rows="6"
                placeholder="Escribe tu mensaje"
            ></textarea>

            <button type="submit">
                Enviar mensaje
            </button>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 TechZone. Todos los derechos reservados.</p>
</footer>

</body>
</html>
